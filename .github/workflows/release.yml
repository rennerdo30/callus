name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build release archive (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: callus
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: callus
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: callus.exe
    # Public repository: GitHub-hosted runners only.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded React 19 Web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Build release binary
        run: cargo build --release --locked --bin callus
      - name: Package release archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          NAME="callus-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/release/${{ matrix.bin }}" "dist/${NAME}/"
          cp README.md LICENSE SECURITY.md "dist/${NAME}/"
          cp -r packs "dist/${NAME}/packs"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "${NAME}.zip" "${NAME}")
          else
            (cd dist && tar -czf "${NAME}.tar.gz" "${NAME}")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  docker-ghcr:
    name: Build & publish GHCR Docker image (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binaries, docker-ghcr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "Callus ${GITHUB_REF_NAME}" \
            --generate-notes
